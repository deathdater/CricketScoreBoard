// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    alias(libs.plugins.android.application) apply false
}

// When the project lives on a non-APFS external volume (e.g. exFAT), macOS writes
// AppleDouble "._*" files next to build outputs, which breaks AGP resource parsing.
// Redirect build outputs to the local disk in that case.
if (rootDir.absolutePath.startsWith("/Volumes/")) {
    def localBuildRoot = new File(System.getProperty("user.home"), ".gradle-builds/${rootProject.name}")
    allprojects { p ->
        p.layout.buildDirectory.set(new File(localBuildRoot, p == p.rootProject ? "root" : p.name))
    }
}
